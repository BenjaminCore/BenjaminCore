<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330">
<rect width="1400" height="330" rx="24" fill="#0D1117"/>
<style>
.stage{font:700 20px Arial,sans-serif;fill:#F0F2F4;letter-spacing:1px}
.note{font:400 14px Arial,sans-serif;fill:#8B949E}
.active{fill:#D6C3A0;stroke:#D6C3A0}
.future{fill:#0D1117;stroke:#D6C3A0;stroke-width:3}
.track{stroke:#30363D;stroke-width:4}
.accent{font:700 14px Arial,sans-serif;fill:#D6C3A0;letter-spacing:2px}
</style>
<text x="70" y="60" class="accent">CURRENT FOCUS</text>
<line x1="150" y1="155" x2="1250" y2="155" class="track"/>
<g text-anchor="middle">
<circle cx="150" cy="155" r="24" class="active"/><text x="150" y="220" class="stage">CS50</text><text x="150" y="245" class="note">foundations</text>
<circle cx="425" cy="155" r="24" class="future"/><text x="425" y="220" class="stage">JAVA</text><text x="425" y="245" class="note">backend depth</text>
<circle cx="700" cy="155" r="24" class="future"/><text x="700" y="220" class="stage">ANGULAR</text><text x="700" y="245" class="note">frontend depth</text>
<circle cx="975" cy="155" r="24" class="future"/><text x="975" y="220" class="stage">CLOUD</text><text x="975" y="245" class="note">AWS and delivery</text>
<circle cx="1250" cy="155" r="24" class="future"/><text x="1250" y="220" class="stage">AI</text><text x="1250" y="245" class="note">agentic systems</text>
</g>
</svg>