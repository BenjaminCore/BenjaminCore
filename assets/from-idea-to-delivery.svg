<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="290" viewBox="0 0 1400 290">
  <rect width="1400" height="290" rx="18" fill="#0D1117"/>

  <style>
    .number {
      font: 600 18px Arial, sans-serif;
      fill: #8B949E;
      letter-spacing: 3px;
    }
    .main {
      font: 700 30px Arial, sans-serif;
      fill: #D6C3A0;
      letter-spacing: 3px;
    }
    .second {
      font: 600 22px Arial, sans-serif;
      fill: #F0F2F4;
      letter-spacing: 2px;
    }
    .line {
      stroke: #30363D;
      stroke-width: 2;
    }
    .arrow {
      stroke: #D6C3A0;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <line x1="350" y1="55" x2="350" y2="235" class="line"/>
  <line x1="700" y1="55" x2="700" y2="235" class="line"/>
  <line x1="1050" y1="55" x2="1050" y2="235" class="line"/>

  <g text-anchor="middle">
    <text x="175" y="78" class="number">01</text>
    <text x="175" y="140" class="main">PRODUCT</text>
    <text x="175" y="184" class="second">DESIGN</text>

    <text x="525" y="78" class="number">02</text>
    <text x="525" y="140" class="main">DATA</text>
    <text x="525" y="184" class="second">BACKEND</text>

    <text x="875" y="78" class="number">03</text>
    <text x="875" y="140" class="main">FRONTEND</text>
    <text x="875" y="184" class="second">CI/CD</text>

    <text x="1225" y="78" class="number">04</text>
    <text x="1225" y="140" class="main">CLOUD</text>
    <text x="1225" y="184" class="second">AI</text>
  </g>

  <path d="M320 145h18m-8-8 8 8-8 8" class="arrow"/>
  <path d="M670 145h18m-8-8 8 8-8 8" class="arrow"/>
  <path d="M1020 145h18m-8-8 8 8-8 8" class="arrow"/>
</svg>